<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="spideyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c070c" />
      <stop offset="70%" stop-color="#090508" />
      <stop offset="100%" stop-color="#020104" />
    </radialGradient>
    
    <!-- Crimson Spider Red Gradient -->
    <linearGradient id="spideyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Glowing Blue Dot Accent Gradient -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- Outer Glow -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#spideyBg)" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Spider-Web Lattice Lines -->
  <g stroke="#dc2626" stroke-width="0.8" stroke-opacity="0.35" fill="none">
    <!-- Web Radials -->
    <line x1="32" y1="6" x2="32" y2="58" />
    <line x1="6" y1="32" x2="58" y2="32" />
    <line x1="14" y1="14" x2="50" y2="50" />
    <line x1="50" y1="14" x2="14" y2="50" />
    <!-- Web Rings -->
    <circle cx="32" cy="32" r="12" />
    <circle cx="32" cy="32" r="22" stroke-dasharray="2 3" />
  </g>

  <!-- Stylized Spider-Man Mask Emblem (Center) -->
  <g filter="url(#crimsonGlow)">
    <!-- Mask Silhouette -->
    <path d="M32 12 C44 12 49 20 49 32 C49 44 40 52 32 54 C24 52 15 44 15 32 C15 20 20 12 32 12 Z" 
          fill="url(#spideyRed)" stroke="#000000" stroke-width="1.5" />

    <!-- Left Eye (Angular White Lens with Black Rim) -->
    <polygon points="21,30 29,33 28,38 21,36" fill="#ffffff" stroke="#090508" stroke-width="1.8" stroke-linejoin="round" />
    <!-- Right Eye (Angular White Lens with Black Rim) -->
    <polygon points="43,30 35,33 36,38 43,36" fill="#ffffff" stroke="#090508" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Web Lines on Mask -->
    <path d="M32 12 L32 54" stroke="#090508" stroke-width="1" />
    <path d="M22 20 Q32 25 42 20" stroke="#090508" stroke-width="0.8" fill="none" />
    <path d="M18 32 Q32 38 46 32" stroke="#090508" stroke-width="0.8" fill="none" />
    <path d="M22 44 Q32 48 42 44" stroke="#090508" stroke-width="0.8" fill="none" />
  </g>

  <!-- Player Blue Dot Indicator (Signature Blue Dot 🔵) -->
  <circle cx="32" cy="46" r="3.5" fill="url(#blueGlow)" stroke="#ffffff" stroke-width="1" />
</svg>
